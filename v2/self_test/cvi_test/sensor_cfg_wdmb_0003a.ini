; sample_vi.ini

; section for source
[source]
;type = SOURCE_USER_FE
dev_num = 2

; section for sensor
[sensor]
; sensor name
name = SOI_F35_MIPI_2M_30FPS_10BIT
;name = SOI_F35_MIPI_2M_30FPS_10BIT_WDR2TO1

;bus/i2c dev number
bus_id = 3
;mipi-rx dev number
mipi_dev = 0
;mipi-rx lane mapping
lane_id = 1, 2, 3, -1, -1
pn_swap = 1, 1, 1, 0, 0

; section for sensor2
[sensor2]
sensor name
name = SOI_F35_SLAVE_MIPI_2M_30FPS_10BIT
;name = SOI_F35_SLAVE_MIPI_2M_30FPS_10BIT_WDR2TO1

;bus/i2c dev number
bus_id = 0
;mipi-rx dev number
mipi_dev = 1
;mipi-rx lane mapping
lane_id = 4, 2, 0, -1, -1
pn_swap = 1, 1, 1, 0, 0
